}

:root {
  --maroon: #3D0F14;
  --pink:   #ED5C88;
  --cream:  #FAF0E0;
  --green:  #1B7A52;
  --ground: #F8E4C4;
  --muted:  #7A5A5E;
  --rule:   #E6D2B5;
  --display: "QuizDisplay", "Baloo 2", "Segoe UI Black", "Arial Rounded MT Bold", "Nirmala UI", sans-serif;
  --sans: -apple-system, "Segoe UI", Roboto, "Nirmala UI", sans-serif;
  --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--maroon);
  font: 16px/1.45 var(--sans);
}

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

.display { font-family: var(--display); font-weight: 800; }

header h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); line-height: 1.05; }
header .kicker { margin: 0 0 4px; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--green); font-weight: 700; }

.warning {
  margin: 16px 0 0;
  padding: 12px 16px;
  background: var(--pink);
  color: var(--cream);
  border-radius: 10px;
  font-weight: 600;
}

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.toolbar a, .toolbar button {
  font: 600 15px var(--sans);
  color: var(--maroon);
  background: var(--cream);
  border: 2px solid var(--maroon);
  border-radius: 999px;
  padding: 6px 14px;
  text-decoration: none;
  cursor: pointer;
}

.board {
  margin-top: 32px;
  background: var(--cream);
  border: 3px solid var(--maroon);
  border-radius: 14px;
  padding: 20px 16px;
}
.board > h2 { margin: 0; font-size: 30px; }

.hidden-photo {
  margin: 8px 0 0;
  padding: 10px 14px;
  border-left: 5px solid var(--green);
  background: #fff8ec;
}
.hidden-photo b { color: var(--green); }
.hidden-photo .unset { color: var(--muted); font-style: italic; }

.category { margin-top: 22px; break-inside: avoid; }
.category h3 {
  margin: 0;
  display: inline-block;
  padding: 2px 12px;
  background: var(--green);
  color: var(--cream);
  border-radius: 6px;
  font-size: 18px;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.category .instruction { margin: 4px 0 6px; color: var(--muted); font-size: 14px; }

table { width: 100%; border-collapse: collapse; }
td { padding: 8px 6px; vertical-align: top; border-top: 1px solid var(--rule); }
td.pts { width: 44px; font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--pink); }
td.q { width: 45%; color: var(--muted); font-size: 14px; }
td.a { font-weight: 700; font-size: 17px; }
td.a .note { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
td.q img { display: block; width: 96px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--rule); }
.emoji { font-family: var(--emoji); font-size: 22px; letter-spacing: .1em; color: var(--maroon); }

@media (max-width: 560px) {
  td.q { width: 40%; }
  td.q img { width: 72px; height: 48px; }
}

@media print {
  body { background: #fff; font-size: 12px; }
  main { max-width: none; padding: 0; }
  .toolbar, .warning { display: none; }
  .board { border-width: 2px; padding: 12px; margin-top: 0; break-before: page; }
  .board:first-of-type { break-before: auto; }
  td { padding: 4px; }
  td.a { font-size: 13px; }
  td.q img { width: 64px; height: 42px; }
}
</style>

(function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const clip = (s, n) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : s;

  // A short reminder of the question, so the host can match the answer to the screen.
  function questionHint(cell) {
    const p = cell.prompt;
    switch (cell.promptType) {
      case "image":     return `<img src="${esc(p)}" alt="">`;
      case "audio":     return "🎵 Audio clip";
      case "emoji":     return `<span class="emoji">${esc(p)}</span>`;
      case "longText":  return esc(clip(p, 90));
      case "clueChain": return `Clue 1: ${esc(clip(p[0], 80))}`;
      case "list":      return esc(p.join(" · "));
      default:          return esc(p);
    }
  }

  function hiddenAnswer(board) {
    const a = (board.hiddenImageAnswer || "").trim();
    if (!a || /^TBD/i.test(a)) return `<span class="unset">Not set yet</span>`;
    return esc(a);
  }

  const title = [QUIZ.meta.title, "Answer Sheet"].filter(Boolean).join(" · ");
  document.getElementById("title").textContent = title;

  document.getElementById("sheet").innerHTML = QUIZ.boards.map(board => `
    <section class="board">
      <h2 class="display">${esc(board.title)}</h2>
      <p class="hidden-photo"><b>Hidden photo:</b> ${hiddenAnswer(board)}</p>
      ${board.columns.map(col => `
        <div class="category">
          <h3 class="display">${esc(col.title)}</h3>
          <p class="instruction">${esc(col.instruction || "")}</p>
          <table>
            ${col.cells.map(cell => `
              <tr>
                <td class="pts">${cell.points}</td>
                <td class="q">${questionHint(cell)}</td>
                <td class="a">${esc(cell.answer)}${cell.answerNote ? `<span class="note">${esc(cell.answerNote)}</span>` : ""}</td>
              </tr>`).join("")}
          </table>
        </div>`).join("")}
    </section>`).join("");
})();
